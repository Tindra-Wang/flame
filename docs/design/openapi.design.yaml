  "components": {
    "schemas": {
      "Error": {
        "type": "object",
        "required": [
          "code",
          "message"
        ],
        "properties": {
          "code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "request_id": {
            "type": "string"
          }
        }
      },
      "JobRequest": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "scene_id",
          "count",
          "budget"
        ],
        "properties": {
          "scene_id": {
            "type": "string",
            "format": "uuid"
          },
          "count": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10000
          },
          "model_id": {
            "type": "string",
            "format": "uuid"
          },
          "budget": {
            "type": "object",
            "required": [
              "gpu_seconds",
              "max_attempts"
            ],
            "properties": {
              "gpu_seconds": {
                "type": "integer",
                "minimum": 0
              },
              "max_attempts": {
                "type": "integer",
                "minimum": 1,
                "maximum": 3
              },
              "storage_bytes": {
                "type": "integer",
                "minimum": 0
              }
            }
          }
        }
      },
      "Job": {
        "type": "object",
        "required": [
          "id",
          "status"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "status": {
            "type": "string",
            "enum": [
              "queued",
              "running",
              "retry_wait",
              "cancel_requested",
              "cancelled",
              "failed",
              "succeeded"
            ]
          },
          "stages": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "usage": {
            "type": "object"
          },
          "error": {
            "type": [
              "object",
              "null"
            ]
          }
        }
      },
      "AnnotationUpdate": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "image_sha256",
          "base_revision",
          "boxes"
        ],
        "properties": {
          "image_sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "base_revision": {
            "type": "integer",
            "minimum": 0
          },
          "boxes": {
            "type": "array",
            "items": {
              "type": "array",
              "minItems": 4,
              "maxItems": 4,
              "items": {
                "type": "number",
                "minimum": 0
              }
            }
          }
        }
      },
      "ReviewRequest": {
        "type": "object",
        "required": [
          "annotation_revision_id",
          "image_sha256",
          "decision"
        ],
        "properties": {
          "annotation_revision_id": {
            "type": "string",
            "format": "uuid"
          },
          "image_sha256": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "decision": {
            "enum": [
              "approved",
              "rejected"
            ]
          },
          "reason": {
            "type": "string"
          }
        }
      },
      "WorkerResult": {
        "type": "object",
        "required": [
          "lease_generation",
          "stage",
          "status",
          "manifest_sha256"
        ],
        "properties": {
          "lease_generation": {
            "type": "integer",
            "minimum": 1
          },
          "stage": {
            "enum": [
              "fds",
              "render",
              "diffusion",
              "annotation",
              "quality",
              "export",
              "evaluation"
            ]
          },
          "status": {
            "enum": [
              "succeeded",
              "failed",
              "cancelled"
            ]
          },
          "manifest_sha256": {
            "type": "string"
          },
          "artifact_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "actual_usage": {
            "type": "object"
          },
          "error": {
            "type": "object"
          }
        }
      },
      "ExperimentRequest": {
        "type": "object",
        "required": [
          "kind",
          "config"
        ],
        "properties": {
          "kind": {
            "enum": [
              "physical",
              "fid",
              "detection_pair",
              "visual_review"
            ]
          },
          "config": {
            "type": "object",
            "description": "Typed per kind in implementation; freeze dataset/model/reference hashes and matched budgets"
          },
          "version_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "format": "uuid"
            }
          }
        }
      },
      "VersionRequest": {
        "type": "object",
        "required": [
          "name",
          "sample_ids"
        ],
        "properties": {
          "name": {
            "type": "string",
            "minLength": 1
          },
          "sample_ids": {
            "type": "array",
            "minItems": 1,
            "items": {
              "type": "string",
              "format": "uuid"
            }
          },
          "group_seed": {
            "type": "integer",
            "default": 42
          }
        }
      },
      "TaskAccepted": {
        "type": "object",
        "required": [
          "job_id",
          "status_url"
        ],
        "properties": {
          "job_id": {
            "type": "string",
            "format": "uuid"
          },
          "status_url": {
            "type": "string"
          },
          "status": {
            "type": "string",
            "const": "queued"
          }
        }
      },
      "AnnotationRevision": {
        "type": "object",
        "required": [
          "id",
          "sample_id",
          "revision",
          "image_sha256"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "sample_id": {
            "type": "string",
            "format": "uuid"
          },
          "revision": {
            "type": "integer",
            "minimum": 1
          },
          "image_sha256": {
            "type": "string"
          },
          "label_studio_annotation_id": {
            "type": "string"
          }
        }
      },
      "ReviewDecision": {
        "type": "object",
        "required": [
          "id",
          "annotation_revision_id",
          "decision"
        ],
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "annotation_revision_id": {
            "type": "string",
            "format": "uuid"
          },
          "decision": {
            "enum": [
              "approved",
              "rejected"
            ]
          }
        }
      },
      "Page": {
        "type": "object",
        "required": [
          "items",
          "total"
        ],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object"
            }
          },
          "total": {
            "type": "integer",
            "minimum": 0
          }
        }
      }
    },
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      },
      "WorkerKey": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Worker-Key",
        "description": "Scoped service credential; LS callback additionally verifies a webhook signature"
      }
    }
  }
}