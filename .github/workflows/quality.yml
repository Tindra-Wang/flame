name: AI07 quality
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[web,test,simulation]'
      - run: python -m pytest -q --basetemp=.cache/ci-test --cov=fire_modeling --cov=platform_api --cov=docker --cov-fail-under=70 --cov-report=xml:artifacts/platform/coverage.xml --junitxml=artifacts/platform/junit.xml
      - uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: artifacts/platform/*.xml
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci --prefix integrations/firephantom/web --no-audit --no-fund
      - run: node integrations/firephantom/web/node_modules/vite/bin/vite.js build --config scene-editor/vite.config.mjs
      - run: npm ci && npm run build
        working-directory: web
  sonar:
    if: ${{ vars.SONAR_HOST_URL != '' }}
    needs: [test, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with: {name: test-evidence, path: artifacts/platform}
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
