[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai07-fire-modeling"
version = "0.1.0"
description = "Traceable fire dataset modeling and evaluation pipeline"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13", "scipy>=1.10,<2"]

[project.optional-dependencies]
simulation = ["fdsreader==1.14.0"]
diffusion = ["torch>=2.2", "diffusers>=0.30,<1", "transformers>=4.40,<5", "accelerate>=0.30", "safetensors>=0.4"]
evaluation = ["torch>=2.2", "torchvision>=0.17", "pytorch-fid>=0.3", "ultralytics>=8.3,<9"]
test = ["pytest>=8", "pytest-cov>=5"]
web = ["fastapi>=0.143,<0.144", "uvicorn>=0.54,<0.55", "sqlalchemy>=2.1,<2.2", "psycopg[binary]>=3.3,<3.4", "httpx>=0.28,<0.29", "dvc>=3.67,<3.68", "python-multipart>=0.0.32"]

[project.scripts]
fire-model = "fire_modeling.cli:main"

[tool.setuptools.packages.find]
include = ["fire_modeling*", "platform_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
