server {
  listen 80;
  server_name localhost;
  client_max_body_size 52m;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://platform-api:8090; proxy_read_timeout 1200s; proxy_send_timeout 1200s; proxy_set_header Host $host; }
  location = /docs { proxy_pass http://platform-api:8090; }
  location = /openapi.json { proxy_pass http://platform-api:8090; }
  location = /metrics { proxy_pass http://platform-api:8090; }
  location / { try_files $uri $uri/ /index.html; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
}
